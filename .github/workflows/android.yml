name: Build APK (ULTIMATE FIXED)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🐍 Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: ☕ Sistem bağımlılıkları
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-11-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: 📦 Python bağımlılıkları
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: 🧹 Temizlik
        run: |
          rm -rf ~/.buildozer
          rm -rf $ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT

      - name: 📥 Android cmdline-tools indir
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q tools.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

      - name: 🔧 SDK kur (HATASIZ)
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;30.0.3"

      - name: 🔧 Buildozer için sdkmanager FIX
        run: |
          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          ln -s $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/sdkmanager || true

      - name: 🔍 AIDL kontrol
        run: |
          find $ANDROID_SDK_ROOT -name aidl || true

      - name: 🔗 Buildozer SDK path FIX (EN KRİTİK)
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -s $ANDROID_SDK_ROOT ~/.buildozer/android/platform/android-sdk

      - name: ⚙️ buildozer.spec FIX
        run: |
          if [ -f buildozer.spec ]; then
            sed -i '/^android.api/d' buildozer.spec
            sed -i '/^android.minapi/d' buildozer.spec
            sed -i '/^android.build_tools_version/d' buildozer.spec

            echo "android.api = 31" >> buildozer.spec
            echo "android.minapi = 21" >> buildozer.spec
            echo "android.build_tools_version = 30.0.3" >> buildozer.spec
          else
            echo "buildozer.spec bulunamadı"
            exit 1
          fi

      - name: 🚀 APK build
        run: |
          export ANDROIDSDK=$ANDROID_SDK_ROOT
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          buildozer android debug

      - name: 📦 APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
