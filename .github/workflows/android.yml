name: Build APK (Debug — Clean + Verify)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk rsync
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython
        shell: bash

      - name: Clean old Android SDK and buildozer cache
        run: |
          rm -rf ~/.buildozer/android
          sudo rm -rf "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT"
        shell: bash

      - name: Prepare ANDROID_SDK_ROOT
        run: |
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
        shell: bash

      - name: Install Android SDK commandline tools
        run: |
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          sudo rsync -a /tmp/cmdline-tools/cmdline-tools/ "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_SDK_ROOT/cmdline-tools"
        shell: bash

      - name: Install platform-tools and build-tools (use 33)
        run: |
          sudo apt update
          sudo apt install -y coreutils wget unzip || true
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; listing cmdline-tools directory:"
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platform-tools" "platforms;android-31" "build-tools;33.0.0" || true
        shell: bash

      - name: Add Android SDK license files (deterministic)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          cat > "$ANDROID_SDK_ROOT/licenses/android-sdk-license" <<'EOF'24333f8a63b6825ea9c5514f83c2829b004d1feed56f5187479451eabf01fb78af6dfcb131a6481e
          EOF
          cat > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license" <<'EOF'84831b9409646a918e30573bab4c9c91346d8ab1
          EOF
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_SDK_ROOT/licenses"
        shell: bash

      - name: Verify installed SDKs
        run: |
          echo "SDK root: $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list || true
        shell: bash

      - name: Force buildozer to use build-tools 33
        run: |
          # ensure buildozer.spec exists and force the build_tools version
          if [ -f buildozer.spec ]; then
            sed -i '/^android.build_tools_version/ d' buildozer.spec || true
            echo "android.build_tools_version = 33.0.0" >> buildozer.spec
            sed -n '1,200p' buildozer.spec
          else
            echo "buildozer.spec not found in repo root"
            exit 1
          fi
        shell: bash

      - name: Clean buildozer
        run: |
          buildozer android clean || true
        shell: bash

      - name: Build APK (verbose)
        run: |
          buildozer -v android debug 2>&1 | tee buildozer-output.log
          tail -n 200 buildozer-output.log
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fertilizer-apk
          path: bin/*.apk
