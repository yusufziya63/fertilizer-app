name: Build APK (Stable)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo çek
      uses: actions/checkout@v3

    - name: Python kur
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Sistem paketleri
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk

    - name: Python paketleri
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Buildozer init
      run: |
        buildozer init || true

    - name: APK build
      run: |
        buildozer -v android debug

    - name: APK yükle
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
