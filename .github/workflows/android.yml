name: Build APK (Final Fix)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk rsync
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython
        shell: bash

      - name: Create ANDROID_SDK_ROOT dirs
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
        shell: bash

      - name: Install Android SDK commandline tools
        run: |
          curl -sSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          sudo rsync -a /tmp/cmdline-tools/cmdline-tools/ "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          sudo chown -R "$(id -u):$(id -g)" "$ANDROID_SDK_ROOT/cmdline-tools"
        shell: bash

      - name: Accept Android SDK licenses and install build-tools
        run: |
          sudo apt update
          sudo apt install -y coreutils wget unzip || true
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found; listing cmdline-tools directory:"
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools" || true
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
            ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" || true
            exit 1
          fi
          # Paket yükle
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-31" "build-tools;37.0.0"
          # Lisansları kabul et (broken pipe önüne geçmek için loop)
          # Bu while döngüsü sdkmanager --licenses çıktısını düzgün işleyip tüm lisansları kabul eder
          RET=1
          COUNTER=0
          until [ "$RET" -eq 0 ] || [ "$COUNTER" -ge 5 ]; do
            printf 'y\n' | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
            RET=$?
            COUNTER=$((COUNTER+1))
            sleep 1
          done
          if [ "$RET" -ne 0 ]; then
            echo "Warning: some licenses may not have been accepted; continuing anyway."
          fi
        shell: bash

      - name: Clean buildozer
        run: |
          buildozer android clean || true
        shell: bash

      - name: Build APK
        run: |
          buildozer -v android debug
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fertilizer-apk
          path: bin/*.apk
