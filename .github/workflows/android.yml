name: Build APK (Stable)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_SDK_ROOT: /home/runner/Android/Sdk

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: ☕ Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-11-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: 🧹 Clean old buildozer & SDK
        run: |
          rm -rf ~/.buildozer
          rm -rf $ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT

      - name: 📥 Install Android cmdline-tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q tools.zip
          mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

      - name: 🔧 Setup SDK + Accept Licenses
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses

          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;30.0.3"

      - name: 🔍 Verify SDK
        run: |
          ls -la $ANDROID_SDK_ROOT
          ls -la $ANDROID_SDK_ROOT/build-tools

      - name: ⚙️ Fix buildozer.spec
        run: |
          if [ -f buildozer.spec ]; then
            sed -i '/^android.api/d' buildozer.spec
            sed -i '/^android.minapi/d' buildozer.spec
            sed -i '/^android.build_tools_version/d' buildozer.spec

            echo "android.api = 31" >> buildozer.spec
            echo "android.minapi = 21" >> buildozer.spec
            echo "android.build_tools_version = 30.0.3" >> buildozer.spec
          else
            echo "buildozer.spec not found!"
            exit 1
          fi

      - name: 🚀 Build APK
        run: |
          export PATH=$ANDROID_SDK_ROOT/platform-tools:$PATH
          buildozer android debug

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
